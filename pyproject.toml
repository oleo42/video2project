[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2project"
version = "0.1.0"
description = "Paste a YouTube URL, get a verified markdown + JSON knowledge artifact"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zyx" }]
dependencies = [
    "yt-dlp>=2026.1.1",
    "openai>=1.50.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Browser-capture pipeline (Whisper transcription + PaddleOCR). Optional so the
# base yt-dlp path stays lightweight; install with: pip install -e ".[capture]"
capture = [
    "faster-whisper>=1.0.0",
    "paddleocr>=2.7.0",
    "paddlepaddle==3.2.2",  # 3.3.1 has a OneDNN/PIR crash on some CPUs
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
video2project = "video2project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"video2project" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
